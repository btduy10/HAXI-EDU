services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haxi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-haxi_edu}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - haxi_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haxi} -d ${POSTGRES_DB:-haxi_edu}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  haxi_pgdata:
